<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
        }
        
        .preview-container {
            width: 1200px;
            height: 630px;
            position: relative;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            overflow: hidden;
        }
        
        .preview-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255, 0, 255, 0.1) 0%, transparent 50%);
        }
        
        .preview-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 60px;
            z-index: 10;
        }
        
        .profile-image {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 4px solid #00d4ff;
            box-shadow: 
                0 0 20px rgba(0, 212, 255, 0.5),
                0 0 40px rgba(255, 0, 255, 0.3),
                inset 0 0 20px rgba(0, 212, 255, 0.2);
            object-fit: cover;
            margin-right: 40px;
            animation: pulse 3s ease-in-out infinite;
        }
        
        .text-content {
            flex: 1;
            color: #ffffff;
        }
        
        .name {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff 0%, #ff00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }
        
        .title {
            font-size: 24px;
            color: #00d4ff;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .description {
            font-size: 18px;
            color: #cccccc;
            line-height: 1.4;
            margin-bottom: 30px;
        }
        
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .skill-tag {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .decorative-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        
        .code-element {
            position: absolute;
            font-family: 'JetBrains Mono', monospace;
            color: rgba(0, 212, 255, 0.3);
            font-size: 20px;
        }
        
        .code-element:nth-child(1) { top: 20px; right: 20px; }
        .code-element:nth-child(2) { bottom: 30px; left: 30px; }
        .code-element:nth-child(3) { top: 50%; right: 60px; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .glow-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.2) 0%, transparent 70%);
            animation: rotate 10s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="preview-background"></div>
        <div class="decorative-elements">
            <div class="code-element">&lt;/&gt;</div>
            <div class="code-element">{...}</div>
            <div class="code-element">DevOps</div>
        </div>
        <div class="glow-effect"></div>
        <div class="preview-content">
            <img src="professionalImage.jpeg" alt="Siseko Makomazi" class="profile-image">
            <div class="text-content">
                <h1 class="name">Siseko Makomazi</h1>
                <h2 class="title">DevOps Engineer & Full Stack Developer</h2>
                <p class="description">Specializing in cloud technologies, CI/CD pipelines, containerization, and modern web development. Passionate about automation and scalable solutions.</p>
                <div class="skills">
                    <span class="skill-tag">DevOps</span>
                    <span class="skill-tag">AWS</span>
                    <span class="skill-tag">Docker</span>
                    <span class="skill-tag">Kubernetes</span>
                    <span class="skill-tag">CI/CD</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
